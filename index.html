<!DOCTYPE html>
<html lang="pt">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <title>Snake Neon Arcade</title>
    <style>
      * {
        box-sizing: border-box;
        touch-action: manipulation;
      }
      body {
        margin: 0;
        background: #090d16;
        color: #f8fafc;
        font-family: Arial, sans-serif;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        padding: 10px;
        user-select: none;
      }
      h1 {
        margin: 0 0 8px 0;
        font-size: 24px;
        color: #38bdf8;
        text-shadow: 0 0 12px rgba(56, 189, 248, 0.6);
      }
      .painel {
        display: flex;
        gap: 25px;
        font-size: 18px;
        font-weight: bold;
        margin-bottom: 8px;
      }
      .pontos { color: #4ade80; }
      .recorde { color: #facc15; }
      canvas {
        background-color: #020617;
        border: 3px solid #1e293b;
        border-radius: 12px;
        box-shadow: 0 0 25px rgba(56, 189, 248, 0.25);
        max-width: 92vw;
        max-height: 48vh;
        touch-action: none;
      }
      /* Botões táteis virtuais para o telemóvel */
      .controlo-virtual {
        margin-top: 14px;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 6px;
      }
      .linha-botoes {
        display: flex;
        gap: 14px;
      }
      .btn-direcao {
        width: 58px;
        height: 58px;
        background: #1e293b;
        color: #38bdf8;
        border: 2px solid #38bdf8;
        border-radius: 50%;
        font-size: 22px;
        font-weight: bold;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        box-shadow: 0 0 10px rgba(56, 189, 248, 0.3);
        transition: 0.1s;
      }
      .btn-direcao:active {
        background: #38bdf8;
        color: #090d16;
        transform: scale(0.92);
      }
      .instrucoes {
        margin-top: 8px;
        color: #94a3b8;
        font-size: 12px;
        text-align: center;
      }
    </style>
  </head>
  <body>
    <h1>Snake Arcade 🎮</h1>
    
    <div class="painel">
      <div>Pontos: <span id="pontuacao" class="pontos">0</span></div>
      <div>Recorde: <span id="recorde" class="recorde">0</span></div>
    </div>

    <!-- Área gráfica do jogo -->
    <canvas id="jogo" width="400" height="400"></canvas>

    <!-- Comandos no ecrã para telemóveis -->
    <div class="controlo-virtual">
      <button class="btn-direcao" onclick="mudarDirecao('ArrowUp')">⬆️</button>
      <div class="linha-botoes">
        <button class="btn-direcao" onclick="mudarDirecao('ArrowLeft')">⬅️</button>
        <button class="btn-direcao" onclick="mudarDirecao('ArrowDown')">⬇️</button>
        <button class="btn-direcao" onclick="mudarDirecao('ArrowRight')">➡️</button>
      </div>
    </div>

    <div class="instrucoes">Jogue com os botões táteis no ecrã ou com as setas do teclado no PC.</div>

    <script>
      const canvas = document.getElementById("jogo");
      const ctx = canvas.getContext("2d");

      const tamanhoGrade = 20;
      const totalBlocos = canvas.width / tamanhoGrade;

      let cobra = [{ x: 10, y: 10 }];
      let direcao = { x: 0, y: 0 };
      let comida = { x: 15, y: 15 };
      let pontos = 0;
      let recorde = 0;
      let jogoAtivo = true;

      function desenhar() {
        ctx.fillStyle = "#020617";
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        // Fruta com brilho néon
        ctx.fillStyle = "#f43f5e";
        ctx.shadowBlur = 10;
        ctx.shadowColor = "#f43f5e";
        ctx.fillRect(comida.x * tamanhoGrade, comida.y * tamanhoGrade, tamanhoGrade - 2, tamanhoGrade - 2);

        // Cobra néon
        cobra.forEach((parte, index) => {
          ctx.fillStyle = index === 0 ? "#4ade80" : "#38bdf8";
          ctx.shadowBlur = 8;
          ctx.shadowColor = ctx.fillStyle;
          ctx.fillRect(parte.x * tamanhoGrade, parte.y * tamanhoGrade, tamanhoGrade - 2, tamanhoGrade - 2);
        });

        ctx.shadowBlur = 0;
      }

      function moverCobra() {
        if (!jogoAtivo || (direcao.x === 0 && direcao.y === 0)) return;

        const cabeca = {
          x: cobra[0].x + direcao.x,
          y: cobra[0].y + direcao.y
        };

        // Colisão com as margens
        if (cabeca.x < 0 || cabeca.x >= totalBlocos || cabeca.y < 0 || cabeca.y >= totalBlocos) {
          finalizarJogo();
          return;
        }

        // Colisão com o corpo
        for (let i = 0; i < cobra.length; i++) {
          if (cabeca.x === cobra[i].x && cabeca.y === cobra[i].y) {
            finalizarJogo();
            return;
          }
        }

        cobra.unshift(cabeca);

        if (cabeca.x === comida.x && cabeca.y === comida.y) {
          pontos += 10;
          document.getElementById("pontuacao").innerText = pontos;
          if (pontos > recorde) {
            recorde = pontos;
            document.getElementById("recorde").innerText = recorde;
          }
          gerarComida();
        } else {
          cobra.pop();
        }
      }

      function gerarComida() {
        comida = {
          x: Math.floor(Math.random() * totalBlocos),
          y: Math.floor(Math.random() * totalBlocos)
        };
      }

      function finalizarJogo() {
        jogoAtivo = false;
        alert("Fim de Jogo! Pontos: " + pontos);
        cobra = [{ x: 10, y: 10 }];
        direcao = { x: 0, y: 0 };
        pontos = 0;
        document.getElementById("pontuacao").innerText = pontos;
        gerarComida();
        jogoAtivo = true;
      }

      // Função universal de mudança de direção
      function mudarDirecao(tecla) {
        switch (tecla) {
          case "ArrowUp":
            if (direcao.y !== 1) direcao = { x: 0, y: -1 };
            break;
          case "ArrowDown":
            if (direcao.y !== -1) direcao = { x: 0, y: 1 };
            break;
          case "ArrowLeft":
            if (direcao.x !== 1) direcao = { x: -1, y: 0 };
            break;
          case "ArrowRight":
            if (direcao.x !== -1) direcao = { x: 1, y: 0 };
            break;
        }
      }

      // Suporte para o teclado físico (no computador)
      window.addEventListener("keydown", (e) => {
        mudarDirecao(e.key);
      });

      // Suporte a gestos com o dedo diretamente no ecrã (Swipe)
      let toqueInicioX = 0;
      let toqueInicioY = 0;

      canvas.addEventListener("touchstart", (e) => {
        toqueInicioX = e.touches[0].clientX;
        toqueInicioY = e.touches[0].clientY;
      }, { passive: false });

      canvas.addEventListener("touchmove", (e) => {
        e.preventDefault();
      }, { passive: false });

      canvas.addEventListener("touchend", (e) => {
        const difX = e.changedTouches[0].clientX - toqueInicioX;
        const difY = e.changedTouches[0].clientY - toqueInicioY;

        if (Math.abs(difX) > Math.abs(difY)) {
          if (difX > 25) mudarDirecao("ArrowRight");
          else if (difX < -25) mudarDirecao("ArrowLeft");
        } else {
          if (difY > 25) mudarDirecao("ArrowDown");
          else if (difY < -25) mudarDirecao("ArrowUp");
        }
      });

      // Ciclo de atualização contínuo
      setInterval(() => {
        moverCobra();
        desenhar();
      }, 100);
    </script>
  </body>
</html>
